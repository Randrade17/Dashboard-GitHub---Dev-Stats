
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-mono); }

#app { padding: 1.5rem 0; }

.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 2rem;
  align-items: center;
}

.search-bar input {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.02em;
}

.search-bar button {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.05em;
  padding: 0 16px;
  cursor: pointer;
  white-space: nowrap;
}

.profile-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}

.avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 0.5px solid var(--color-border-tertiary);
  flex-shrink: 0;
}

.avatar-placeholder {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 500;
  color: var(--color-text-secondary);
  flex-shrink: 0;
}

.profile-info { flex: 1; min-width: 0; }

.profile-name {
  font-size: 18px;
  font-weight: 500;
  color: var(--color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.profile-login {
  font-size: 12px;
  color: var(--color-text-secondary);
  letter-spacing: 0.04em;
  margin-top: 2px;
}

.profile-bio {
  font-size: 12px;
  color: var(--color-text-secondary);
  margin-top: 6px;
  font-family: var(--font-sans);
  line-height: 1.5;
}

.profile-meta {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.profile-meta-item {
  font-size: 11px;
  color: var(--color-text-tertiary);
  display: flex;
  align-items: center;
  gap: 4px;
  letter-spacing: 0.03em;
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 2rem;
}

.metric-card {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-md);
  padding: 14px 16px;
}

.metric-label {
  font-size: 10px;
  color: var(--color-text-tertiary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-family: var(--font-mono);
}

.metric-value {
  font-size: 22px;
  font-weight: 500;
  color: var(--color-text-primary);
  font-family: var(--font-mono);
  line-height: 1;
}

.metric-sub {
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-top: 4px;
}

.section-title {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  margin-bottom: 12px;
  font-family: var(--font-mono);
}

.repos-list { margin-bottom: 2rem; }

.repo-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}

.repo-item:last-child { border-bottom: none; }

.repo-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--color-text-primary);
  font-family: var(--font-mono);
}

.repo-desc {
  font-size: 12px;
  color: var(--color-text-secondary);
  margin-top: 3px;
  font-family: var(--font-sans);
  line-height: 1.4;
}

.repo-meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.repo-lang {
  font-size: 11px;
  color: var(--color-text-secondary);
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 5px;
}

.lang-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.repo-stat {
  font-size: 11px;
  color: var(--color-text-tertiary);
  display: flex;
  align-items: center;
  gap: 4px;
}

.repo-numbers {
  text-align: right;
  flex-shrink: 0;
}

.stars-count {
  font-size: 13px;
  font-weight: 500;
  color: var(--color-text-primary);
  font-family: var(--font-mono);
}

.stars-label {
  font-size: 10px;
  color: var(--color-text-tertiary);
  letter-spacing: 0.04em;
}

.langs-section { margin-bottom: 2rem; }

.langs-bar {
  height: 6px;
  border-radius: 3px;
  display: flex;
  overflow: hidden;
  margin-bottom: 14px;
  gap: 2px;
}

.lang-segment { border-radius: 3px; transition: opacity 0.2s; }
.lang-segment:hover { opacity: 0.7; }

.langs-list {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.lang-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--color-text-secondary);
  font-family: var(--font-mono);
}

.lang-pct {
  color: var(--color-text-tertiary);
  font-size: 11px;
}

.activity-grid {
  display: grid;
  grid-template-columns: repeat(52, 1fr);
  gap: 2px;
  margin-bottom: 8px;
}

.activity-week { display: grid; grid-template-rows: repeat(7, 1fr); gap: 2px; }

.activity-cell {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 2px;
  background: var(--color-background-secondary);
}

.activity-cell.l1 { background: #9FE1CB; }
.activity-cell.l2 { background: #1D9E75; }
.activity-cell.l3 { background: #0F6E56; }
.activity-cell.l4 { background: #085041; }

.activity-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--color-text-tertiary);
  font-family: var(--font-mono);
  margin-top: 6px;
}

.footer {
  padding-top: 1.5rem;
  border-top: 0.5px solid var(--color-border-tertiary);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: gap;
}

.footer-note {
  font-size: 10px;
  color: var(--color-text-tertiary);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}

.error-msg {
  padding: 2rem;
  text-align: center;
  font-size: 13px;
  color: var(--color-text-secondary);
  font-family: var(--font-mono);
}

.loading-state {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 1rem 0;
}

.skel {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-md);
  height: 14px;
}

.skel.short { width: 40%; }
.skel.medium { width: 65%; }
.skel.full { width: 100%; }
.skel.tall { height: 60px; }

#dashboard { display: none; }
</style>

<h2 class="sr-only">GitHub Dev Stats Dashboard — busca e exibe métricas públicas de um usuário do GitHub</h2>

<div id="app">
  <div class="search-bar">
    <input type="text" id="username-input" placeholder="github username" value="torvalds" />
    <button id="fetch-btn" onclick="fetchGitHub()">→ fetch</button>
  </div>

  <div id="loading" style="display:none" class="loading-state">
    <div class="skel medium"></div>
    <div class="skel full tall"></div>
    <div class="skel short"></div>
    <div class="skel full" style="height:200px; border-radius:var(--border-radius-lg)"></div>
  </div>

  <div id="error" style="display:none" class="error-msg"></div>

  <div id="dashboard">
    <div class="profile-header">
      <img id="avatar" class="avatar" src="" alt="" />
      <div class="profile-info">
        <div class="profile-name" id="profile-name"></div>
        <div class="profile-login" id="profile-login"></div>
        <div class="profile-bio" id="profile-bio"></div>
        <div class="profile-meta" id="profile-meta"></div>
      </div>
    </div>

    <div class="metrics-grid" id="metrics-grid"></div>

    <div class="langs-section" id="langs-section">
      <div class="section-title">top languages</div>
      <div class="langs-bar" id="langs-bar"></div>
      <div class="langs-list" id="langs-list"></div>
    </div>

    <div class="repos-list" id="repos-list">
      <div class="section-title">top repositories</div>
      <div id="repos-items"></div>
    </div>

    <div id="activity-section" style="margin-bottom:2rem">
      <div class="section-title">simulated activity (last 52 weeks)</div>
      <div class="activity-grid" id="activity-grid"></div>
      <div class="activity-labels">
        <span>52 weeks ago</span>
        <span>today</span>
      </div>
    </div>

    <div class="footer">
      <span class="footer-note" id="footer-date"></span>
      <span class="footer-note">github public api · no auth</span>
    </div>
  </div>
</div>

<script>
const LANG_COLORS = {
  JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5',
  Java: '#b07219', 'C++': '#f34b7d', C: '#555555', Go: '#00ADD8',
  Rust: '#dea584', Ruby: '#701516', PHP: '#4F5D95', Swift: '#F05138',
  Kotlin: '#A97BFF', Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c',
  'C#': '#239120', Dart: '#00B4AB', Lua: '#000080', R: '#198CE7',
  Scala: '#c22d40', Vue: '#41b883', default: '#888780'
};

function getLangColor(lang) {
  return LANG_COLORS[lang] || LANG_COLORS.default;
}

function fmtNum(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n.toString();
}

async function fetchGitHub() {
  const username = document.getElementById('username-input').value.trim();
  if (!username) return;

  document.getElementById('loading').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('error').style.display = 'none';

  try {
    const [userRes, reposRes] = await Promise.all([
      fetch(`https://api.github.com/users/${username}`),
      fetch(`https://api.github.com/users/${username}/repos?sort=stars&per_page=100`)
    ]);

    if (!userRes.ok) {
      throw new Error(userRes.status === 404 ? `user "${username}" not found` : 'github api error');
    }

    const user = await userRes.json();
    const repos = reposRes.ok ? await reposRes.json() : [];

    renderDashboard(user, repos);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    const errEl = document.getElementById('error');
    errEl.style.display = 'block';
    errEl.textContent = e.message;
  }
}

function renderDashboard(user, repos) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  const avatar = document.getElementById('avatar');
  avatar.src = user.avatar_url;
  avatar.alt = user.login;

  document.getElementById('profile-name').textContent = user.name || user.login;
  document.getElementById('profile-login').textContent = `@${user.login}`;
  document.getElementById('profile-bio').textContent = user.bio || '';

  const meta = [];
  if (user.location) meta.push(`<span class="profile-meta-item"><i class="ti ti-map-pin" aria-hidden="true"></i>${user.location}</span>`);
  if (user.company) meta.push(`<span class="profile-meta-item"><i class="ti ti-building" aria-hidden="true"></i>${user.company.replace('@','')}</span>`);
  if (user.blog) meta.push(`<span class="profile-meta-item"><i class="ti ti-link" aria-hidden="true"></i>${user.blog.replace('https://','')}</span>`);
  document.getElementById('profile-meta').innerHTML = meta.join('');

  const nonForkRepos = repos.filter(r => !r.fork);
  const totalStars = repos.reduce((s, r) => s + r.stargazers_count, 0);
  const totalForks = repos.reduce((s, r) => s + r.forks_count, 0);
  const memberSince = new Date(user.created_at).getFullYear();
  const yearsActive = new Date().getFullYear() - memberSince;

  const metrics = [
    { label: 'repositories', value: fmtNum(user.public_repos), sub: `${nonForkRepos.length} original` },
    { label: 'total stars', value: fmtNum(totalStars), sub: 'across all repos' },
    { label: 'followers', value: fmtNum(user.followers), sub: `following ${fmtNum(user.following)}` },
    { label: 'member since', value: memberSince, sub: `${yearsActive}y on github` },
    { label: 'gists', value: fmtNum(user.public_gists), sub: 'public gists' },
    { label: 'total forks', value: fmtNum(totalForks), sub: 'of your repos' },
  ];

  document.getElementById('metrics-grid').innerHTML = metrics.map(m => `
    <div class="metric-card">
      <div class="metric-label">${m.label}</div>
      <div class="metric-value">${m.value}</div>
      <div class="metric-sub">${m.sub}</div>
    </div>
  `).join('');

  const langCounts = {};
  repos.forEach(r => {
    if (r.language) langCounts[r.language] = (langCounts[r.language] || 0) + 1;
  });

  const sortedLangs = Object.entries(langCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const totalLangCount = sortedLangs.reduce((s, [,v]) => s + v, 0);

  if (sortedLangs.length > 0) {
    document.getElementById('langs-section').style.display = 'block';
    document.getElementById('langs-bar').innerHTML = sortedLangs.map(([lang, count]) => {
      const pct = Math.round((count / totalLangCount) * 100);
      return `<div class="lang-segment" style="width:${pct}%; background:${getLangColor(lang)}" title="${lang}: ${pct}%"></div>`;
    }).join('');

    document.getElementById('langs-list').innerHTML = sortedLangs.map(([lang, count]) => {
      const pct = Math.round((count / totalLangCount) * 100);
      return `<div class="lang-item">
        <div class="lang-dot" style="background:${getLangColor(lang)}"></div>
        ${lang} <span class="lang-pct">${pct}%</span>
      </div>`;
    }).join('');
  } else {
    document.getElementById('langs-section').style.display = 'none';
  }

  const topRepos = repos.sort((a, b) => b.stargazers_count - a.stargazers_count).slice(0, 6);
  document.getElementById('repos-items').innerHTML = topRepos.map(r => `
    <div class="repo-item">
      <div style="flex:1; min-width:0;">
        <div class="repo-name">${r.name}</div>
        ${r.description ? `<div class="repo-desc">${r.description.slice(0, 90)}${r.description.length > 90 ? '…' : ''}</div>` : ''}
        <div class="repo-meta">
          ${r.language ? `<div class="repo-lang"><div class="lang-dot" style="background:${getLangColor(r.language)}"></div>${r.language}</div>` : ''}
          ${r.fork ? `<div class="repo-stat"><i class="ti ti-git-fork" style="font-size:12px" aria-hidden="true"></i>fork</div>` : ''}
          ${r.topics && r.topics.length ? `<div class="repo-stat" style="font-size:10px">${r.topics.slice(0,2).join(' · ')}</div>` : ''}
        </div>
      </div>
      <div class="repo-numbers">
        <div class="stars-count">★ ${fmtNum(r.stargazers_count)}</div>
        <div class="stars-label">${fmtNum(r.forks_count)} forks</div>
      </div>
    </div>
  `).join('');

  const grid = document.getElementById('activity-grid');
  grid.innerHTML = '';
  for (let w = 0; w < 52; w++) {
    const week = document.createElement('div');
    week.className = 'activity-week';
    for (let d = 0; d < 7; d++) {
      const cell = document.createElement('div');
      cell.className = 'activity-cell';
      const r = Math.random();
      if (r > 0.85) cell.classList.add('l4');
      else if (r > 0.65) cell.classList.add('l3');
      else if (r > 0.45) cell.classList.add('l2');
      else if (r > 0.3) cell.classList.add('l1');
      week.appendChild(cell);
    }
    grid.appendChild(week);
  }

  document.getElementById('footer-date').textContent = `fetched ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
}

document.getElementById('username-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchGitHub();
});

fetchGitHub();
</script>
